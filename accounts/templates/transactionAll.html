{% extends 'home/base.html' %}
{% load static %}
{% block content %}
{% if userRole == 'NONE' %}
<div class="container-fluid">
  <div class="row text-center justify-content-center">
    <div class="card mt-2 mb-2">
      <div class="card-header">
        <div class="row">
          <div class="col-sm-12">
            Unauthorized to view the content
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% else %}
<div class="container-fluid">
  <div class="row text-center justify-content-center">
    <div class="card mt-2 mb-2 w-100">
      <div class="card-header">
        <div class="row">
          <div class="col-sm-6">
            {% if userRole == 'EDIT' %}
              <a href="{% url 'accounts:transactionAdd' %}" class="btn btn-secondary btn-md">Add Transaction</a>
            {% endif %}
          </div>
          <div class="col-sm-6 text-end">
            <a href="{% url 'accounts:transactionList' 0 %}" class="btn btn-secondary btn-md">Edit Transaction</a>
          </div>
        </div>
      </div>
      <div class="card-body">
        <!-- grid container (id + data-url required) -->
        <div id="transaction"
             class="ag-theme-balham"
             style="height:480px;width:100%;"
             data-url="{% url 'accounts:getTransactions' %}"></div>

        <link rel="stylesheet" href="https://unpkg.com/ag-grid-community/dist/styles/ag-grid.css" />
        <link rel="stylesheet" href="https://unpkg.com/ag-grid-community/dist/styles/ag-theme-balham.css" />
        <script src="https://unpkg.com/ag-grid-community/dist/ag-grid-community.min.noStyle.js"></script>

        <script>
        (function(){
          const gridDiv = document.getElementById("transaction");
          if (!gridDiv) return;
          const dataUrl = gridDiv.getAttribute('data-url');

          const gridOptions = {
            columnDefs: [],
            defaultColDef: { sortable: true, filter: true, resizable: true, minWidth: 80 },
            rowSelection: 'multiple',
            animateRows: true,
            onGridReady: params => { params.api.sizeColumnsToFit(); }
          };

          new agGrid.Grid(gridDiv, gridOptions);

          fetch(dataUrl, { credentials: 'same-origin' })
            .then(async r => {
              console.log('GET', dataUrl, 'status', r.status, 'content-type', r.headers.get('content-type'));
              const text = await r.text();
              try {
                const data = JSON.parse(text);
                if (!Array.isArray(data) || data.length === 0) {
                  gridOptions.api.setRowData([]);
                  return;
                }
                const keys = Object.keys(data[0]);
                const colDefs = keys.map(k => ({ field: k, headerName: k, sortable: true, filter: true, resizable: true }));
                gridOptions.api.setColumnDefs(colDefs);
                gridOptions.api.setRowData(data);
              } catch (err) {
                console.error('Failed to parse JSON response — maybe HTML (login redirect)?', err);
                console.log('Response text:', text.slice(0,1000));
              }
            })
            .catch(err => {
              console.error('Fetch error', err);
            });
        })();
        </script>
      </div>
    </div>
  </div>
</div>
{% endif %}

{% include 'home/footer.html' %}
{% endblock %}
