{% extends 'home/base.html' %}
{% load static %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col">
      <div id="containerMonthlyAvg"  data-url={% url 'reports:data_monthlyAvg' %}></div>
    </div>
    <div class="col">
      <div id="containerMonthly"  data-url={% url 'reports:data_monthly' %}></div>
    </div>
  </div>
</div>



<script src="https://code.highcharts.com/highcharts.src.js"></script>
<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script>
    $.ajax({
      url: $("#containerMonthly").attr("data-url"),
      dataType: 'json',
      success: function (data) {
        Highcharts.chart("containerMonthly", data);
      }
    });
    $.ajax({
      url: $("#containerMonthlyAvg").attr("data-url"),
      dataType: 'json',
      success: function (data) {
        Highcharts.chart("containerMonthlyAvg", data);
      }
    });
</script>
{% include 'home/footer.html' %}
{% endblock %}
